<title>Job Hunt Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim sticky header, summary strip, portal row, then tabbed work area (feed, applications, answers, emails, profile).
   Palette: slate-green neutrals, one teal accent, separate semantic status colours. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface2:#e6ebe9; --line:#d3dbd8; --fg:#16211f; --muted:#5b6b67;
  --accent:#0d7468; --accent-ink:#ffffff; --good:#17803d; --good-bg:#dcf2e3; --warn:#9a6700; --warn-bg:#faedc7;
  --bad:#b42318; --bad-bg:#fbdedb; --info:#2457a6; --info-bg:#dce8fa; --idle:#5b6b67; --idle-bg:#e3e8e6;
  --naukri:#2457a6; --indeed:#7a3fb0; --wellfound:#c2410c;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17211f; --surface2:#1f2b29; --line:#2c3b38; --fg:#e6eeec; --muted:#93a39f;
  --accent:#3cc4b2; --accent-ink:#06201c; --good:#5fd38a; --good-bg:#16382a; --warn:#e8b94a; --warn-bg:#3b3012;
  --bad:#ff8f84; --bad-bg:#40201d; --info:#8db6f5; --info-bg:#1a2c4a; --idle:#93a39f; --idle-bg:#243230;
  --naukri:#8db6f5; --indeed:#c79cf0; --wellfound:#f59a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17211f; --surface2:#1f2b29; --line:#2c3b38; --fg:#e6eeec; --muted:#93a39f;
  --accent:#3cc4b2; --accent-ink:#06201c; --good:#5fd38a; --good-bg:#16382a; --warn:#e8b94a; --warn-bg:#3b3012;
  --bad:#ff8f84; --bad-bg:#40201d; --info:#8db6f5; --info-bg:#1a2c4a; --idle:#93a39f; --idle-bg:#243230;
  --naukri:#8db6f5; --indeed:#c79cf0; --wellfound:#f59a6b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile .n{font:600 28px/1.1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px;margin-top:4px}
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:18px}
.portal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.portal h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
.portal .row{display:flex;gap:16px;margin:10px 0 8px;flex-wrap:wrap}
.portal .row div{min-width:0}
.portal .row b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.portal .row span{color:var(--muted);font-size:12px}
.portal p{margin:0;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font:500 11.5px var(--mono);white-space:nowrap}
.s-verified,.s-applied,.s-ok{background:var(--good-bg);color:var(--good)}
.s-applied-unverified,.s-unclear,.s-dry-run,.s-unverified{background:var(--warn-bg);color:var(--warn)}
.s-failed,.s-not-registered,.s-error{background:var(--bad-bg);color:var(--bad)}
.s-skipped,.s-external,.s-idle{background:var(--idle-bg);color:var(--idle)}
.s-info{background:var(--info-bg);color:var(--info)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
nav button{font:600 13px var(--sans);background:none;border:0;color:var(--muted);padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav .c{font:500 11px var(--mono);color:var(--muted);margin-left:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input[type=search]{font:13px var(--sans);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font:600 11.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--mono);font-size:12.5px}
td.q{max-width:340px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:78px 78px 1fr;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed .t{font:12px var(--mono);color:var(--muted)}
.feed .what{min-width:0;overflow-wrap:anywhere}
.feed .what small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.site{font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px}
.daybar{display:flex;align-items:flex-end;gap:8px;height:120px;padding:14px 14px 0}
.daybar .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.daybar .seg{border-radius:3px 3px 0 0;min-height:2px}
.daylab{display:flex;gap:8px;padding:6px 14px 12px}
.daylab span{flex:1;min-width:0;text-align:center;font:11px var(--mono);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;margin-bottom:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.feed li{grid-template-columns:62px 1fr}.feed li .site{grid-column:2}.feed .what{grid-column:1/-1}}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.h{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 14px 4px}
a{color:var(--accent)}
.copy{font:500 11px var(--mono);background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;margin-left:6px}
.failbox{border-color:var(--bad);margin-bottom:14px}
.failbox .hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.failbox .hd b{font-size:15px;color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:2px 10px;cursor:pointer;border:0}
.chip[aria-pressed="true"]{outline:2px solid var(--bad)}
.ev{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.tile.bad .n{color:var(--bad)}
.note{color:var(--muted);font-size:12.5px;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Job Hunt Console</h1>
      <div class="sub">Naukri, Indeed and Wellfound: what was applied to, what was answered, what changed on the profile.</div>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="synced">waiting for data…</span></div>
  </header>

  <section class="tiles" id="tiles" aria-label="Totals"></section>
  <section class="portals" id="portals" aria-label="Portals"></section>
  <section class="panel failbox" id="failbox" aria-label="Failed jobs"></section>

  <div class="grid2">
    <div class="panel"><div class="h">Submitted per day</div><div id="chart"></div></div>
    <div class="panel"><div class="h">Latest activity</div><ul class="feed" id="latest"></ul></div>
  </div>

  <nav role="tablist" id="tabs"></nav>
  <div class="tools">
    <select id="fSite" aria-label="Portal"><option value="">All portals</option><option value="naukri">Naukri</option><option value="indeed">Indeed</option><option value="wellfound">Wellfound</option></select>
    <select id="fDay" aria-label="Day"><option value="">All days</option></select>
    <input type="search" id="fQ" placeholder="Search role, company, question…" aria-label="Search">
  </div>
  <div class="panel scroll" id="view"></div>
  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var SITES={naukri:'Naukri',indeed:'Indeed',wellfound:'Wellfound'};
  var COLOR={naukri:'var(--naukri)',indeed:'var(--indeed)',wellfound:'var(--wellfound)'};
  var RANK={verified:7,applied:6,'applied-unverified':5,'not-registered':4,unclear:3,failed:2,skipped:1,'dry-run':0,external:0,unverified:0};
  var SUBMITTED={verified:1,applied:1,'applied-unverified':1};
  var feedDocs={}, meta={}, tab='feed', tabs=[['feed','Activity'],['fail','Failed'],['apps','Applications'],['qa','Answers'],['mail','Emails'],['prof','Profile']];
  var $=function(id){return document.getElementById(id)};

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pill(status){var s=el('span','pill s-'+(status||'idle'),status||'');return s}
  function day(iso){var d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function hm(iso){return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
  function dlabel(d){var x=new Date(d+'T00:00:00');return x.toLocaleDateString([], {day:'numeric',month:'short'})}
  function siteTag(s){var w=el('span','site');var sw=el('span','swatch');sw.style.background=COLOR[s]||'var(--idle)';w.appendChild(sw);w.appendChild(document.createTextNode(SITES[s]||s||''));return w}
  function all(){var out=[],seen={};Object.keys(feedDocs).forEach(function(k){(feedDocs[k].events||[]).forEach(function(e){if(e.id&&seen[e.id])return;if(e.id)seen[e.id]=1;out.push(e)})});out.sort(function(a,b){return a.ts<b.ts?1:-1});return out}

  /* one row per job: best status wins (verified > applied > ... > dry-run) */
  function applications(ev){
    var m={};
    ev.filter(function(e){return e.type==='apply'}).forEach(function(e){
      var k=[e.site,(e.job||'').toLowerCase().replace(/&amp;/g,'&').trim()].join('|');   /* company is often blank or differs between records of one job */
      var cur=m[k];
      if(!cur){m[k]=Object.assign({},e,{first:e.ts});return}
      if((RANK[e.status]||0)>=(RANK[cur.status]||0)){var first=cur.first;m[k]=Object.assign({},cur,e,{first:first,link:e.link||cur.link,company:e.company||cur.company})}
      else if(e.link&&!cur.link)cur.link=e.link;
    });
    return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.ts<b.ts?1:-1});
  }

  function filtered(list){
    var s=$('fSite').value,d=$('fDay').value,q=$('fQ').value.trim().toLowerCase();
    return list.filter(function(e){
      if(s&&e.site!==s)return false;
      if(d&&day(e.ts)!==d)return false;
      if(q&&JSON.stringify(e).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }

  var failReason='';
  function failedJobs(apps){return apps.filter(function(a){return a.status==='failed'||a.status==='not-registered'})}
  function reasonOf(a){return (a.reason||'unknown').replace(/\s*[\u2014-].*$/,'').slice(0,70)}
  function failRows(list){
    return table(['When','Portal','Role','Company','Why it failed','Evidence','Link'],list.map(function(x){
      var tr=el('tr');tr.appendChild(td(dlabel(day(x.ts))+' '+hm(x.ts),'mono'));tr.appendChild(td(siteTag(x.site)));tr.appendChild(td(x.job||''));tr.appendChild(td(x.company||''));
      var w=el('span');w.appendChild(pill(x.status));w.appendChild(document.createTextNode(' '+(x.reason||'')));tr.appendChild(td(w));
      tr.appendChild(td(x.evidence?el('span','ev',x.evidence):'none captured'));tr.appendChild(td(link(x.link,'posting')));return tr}));
  }
  function renderFailBox(apps){
    var b=$('failbox');b.textContent='';var f=failedJobs(apps);
    var hd=el('div','hd');hd.appendChild(el('b',null,f.length?(f.length+' failed job'+(f.length>1?'s':'')+' need a fix'):'No failed jobs'));
    var counts={};f.forEach(function(a){var r=reasonOf(a);counts[r]=(counts[r]||0)+1});
    var chips=el('div','chips');
    Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).forEach(function(r){var c=el('button','chip',counts[r]+' × '+r);c.type='button';c.setAttribute('aria-pressed',String(failReason===r));c.onclick=function(){failReason=failReason===r?'':r;render()};chips.appendChild(c)});
    hd.appendChild(chips);b.appendChild(hd);
    if(!f.length){b.appendChild(empty('Nothing has failed.','A failed application shows up here with its reason and the evidence folder the nightly agent reads.'));return}
    var show=f.filter(function(a){return !failReason||reasonOf(a)===failReason}).slice(0,6);
    var sc=el('div','scroll');sc.appendChild(failRows(show));b.appendChild(sc);
    if(f.length>show.length){var m=el('div','note',f.length-show.length+' more in the Failed tab.');m.style.padding='0 14px 12px';b.appendChild(m)}
  }
  function renderTiles(ev,apps){
    var today=day(new Date().toISOString());
    var sub=apps.filter(function(a){return SUBMITTED[a.status]});
    var subToday=sub.filter(function(a){return day(a.ts)===today}).length;
    var prof=ev.filter(function(e){return e.type==='profile'});
    var profOk=prof.filter(function(e){return e.ok});
    var emails={};ev.filter(function(e){return e.type==='email'}).forEach(function(e){emails[e.email]=1});
    var qa=ev.filter(function(e){return e.type==='qa'}).length;
    var attention=apps.filter(function(a){return a.status==='failed'||a.status==='not-registered'}).length;
    var data=[[subToday,'submitted today'],[sub.length,'submitted in total'],[apps.filter(function(a){return a.status==='verified'}).length,'confirmed by the portal'],[attention,'jobs failed',1],[qa,'questions answered'],[Object.keys(emails).length,'recruiter emails found'],[profOk.length,'profile updates ('+prof.length+' runs)']];
    var t=$('tiles');t.textContent='';
    data.forEach(function(d){var c=el('div','tile'+(d[2]&&d[0]?' bad':''));c.appendChild(el('div','n',String(d[0])));c.appendChild(el('div','l',d[1]));t.appendChild(c)});
  }

  function renderPortals(ev,apps){
    var box=$('portals');box.textContent='';
    var pm=(meta.portals)||{};
    Object.keys(SITES).forEach(function(s){
      var mine=ev.filter(function(e){return e.site===s});
      var last=mine[0];
      var sub=apps.filter(function(a){return a.site===s&&SUBMITTED[a.status]}).length;
      var tried=apps.filter(function(a){return a.site===s}).length;
      var qa=mine.filter(function(e){return e.type==='qa'}).length;
      var c=el('div','portal');
      var h=el('h3');h.appendChild(siteTag(s));
      var st=(pm[s]&&pm[s].status)||(last?'ok':'idle');
      h.appendChild(pill(st));c.appendChild(h);
      var row=el('div','row');
      [[sub,'submitted'],[tried,'jobs touched'],[qa,'answers']].forEach(function(x){var d=el('div');d.appendChild(el('b',null,String(x[0])));d.appendChild(el('span',null,x[1]));row.appendChild(d)});
      c.appendChild(row);
      c.appendChild(el('p',null,(pm[s]&&pm[s].note)||'No activity recorded yet.'));
      if(last)c.appendChild(el('p','mono','last event '+dlabel(day(last.ts))+' '+hm(last.ts)));
      box.appendChild(c);
    });
  }

  function renderChart(apps){
    var box=$('chart');box.textContent='';
    var days=[];for(var i=9;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(day(d.toISOString()))}
    var counts={};days.forEach(function(d){counts[d]={naukri:0,indeed:0,wellfound:0}});
    apps.forEach(function(a){if(SUBMITTED[a.status]&&counts[day(a.ts)]&&counts[day(a.ts)][a.site]!=null)counts[day(a.ts)][a.site]++});
    var max=Math.max(3,Math.max.apply(null,days.map(function(d){var c=counts[d];return c.naukri+c.indeed+c.wellfound})));
    var bars=el('div','daybar'),labs=el('div','daylab');
    days.forEach(function(d){
      var col=el('div','col');var c=counts[d];var tot=c.naukri+c.indeed+c.wellfound;
      col.title=dlabel(d)+': '+tot+' submitted';
      Object.keys(SITES).forEach(function(s){if(c[s]){var seg=el('div','seg');seg.style.height=(c[s]/max*100)+'%';seg.style.background=COLOR[s];col.appendChild(seg)}});
      bars.appendChild(col);var l=el('span',null,d.slice(8));labs.appendChild(l)});
    box.appendChild(bars);box.appendChild(labs);
    var lg=el('div','legend');Object.keys(SITES).forEach(function(s){var x=el('span','site');var sw=el('span','swatch');sw.style.background=COLOR[s];x.appendChild(sw);x.appendChild(document.createTextNode(SITES[s]));lg.appendChild(x)});
    box.appendChild(lg);
  }

  function describe(e){
    if(e.type==='apply')return [(e.job||'a job')+(e.company?' at '+e.company:''),(e.reason||(e.mode==='dry'?'dry run, nothing sent':'')),e.status];
    if(e.type==='qa')return ['Answered: '+(e.question||'').slice(0,110),'“'+(e.answer||'').slice(0,140)+'”'+(e.job?'  ·  '+e.job:''),'info'];
    if(e.type==='email')return ['Email found: '+e.email,(e.job||'')+(e.company?' at '+e.company:''),'info'];
    if(e.type==='profile')return [e.ok?'Profile refreshed':'Profile refresh failed',e.message||'',e.ok?'ok':'error'];
    return [e.message||e.type,'','idle'];
  }
  function feedItem(e){
    var li=el('li');li.appendChild(el('span','t',dlabel(day(e.ts))+' '+hm(e.ts)));
    var s=el('span');s.appendChild(siteTag(e.site));li.appendChild(s);
    var d=describe(e),w=el('div','what');var top=el('div');top.appendChild(document.createTextNode(d[0]+' '));if(d[2])top.appendChild(pill(d[2]));w.appendChild(top);
    if(d[1])w.appendChild(el('small',null,d[1]));li.appendChild(w);return li;
  }
  function renderLatest(ev){
    var ul=$('latest');ul.textContent='';
    var items=ev.slice(0,8);
    if(!items.length){var li=el('li');li.appendChild(el('span','what','Nothing recorded yet.'));ul.appendChild(li);return}
    items.forEach(function(e){ul.appendChild(feedItem(e))});
  }

  function empty(title,body){var d=el('div','empty');d.appendChild(el('b',null,title));d.appendChild(document.createTextNode(body));return d}
  function table(head,rows){
    var t=el('table'),th=el('thead'),tr=el('tr');head.forEach(function(h){tr.appendChild(el('th',null,h))});th.appendChild(tr);t.appendChild(th);
    var tb=el('tbody');rows.forEach(function(r){tb.appendChild(r)});t.appendChild(tb);return t;
  }
  function td(content,cls){var c=el('td',cls);if(content&&content.nodeType)c.appendChild(content);else c.textContent=content==null?'':content;return c}
  function link(url,label){if(!/^https?:\/\//.test(url||''))return document.createTextNode(label||'');var a=el('a',null,label||'open');a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}

  function renderView(ev,apps){
    var v=$('view');v.textContent='';v.classList.toggle('scroll',tab!=='feed');
    if(tab==='feed'){
      var list=filtered(ev).slice(0,300);
      if(!list.length){v.appendChild(empty('No activity matches.','Clear the filters, or wait for the next run.'));return}
      var ul=el('ul','feed');list.forEach(function(e){ul.appendChild(feedItem(e))});v.appendChild(ul);return;
    }
    if(tab==='fail'){
      var ff=filtered(failedJobs(apps)).filter(function(a){return !failReason||reasonOf(a)===failReason});
      if(!ff.length){v.appendChild(empty('No failed jobs.','Nothing to fix right now.'));return}
      v.appendChild(failRows(ff));return;
    }
    if(tab==='apps'){
      var a=filtered(apps);
      if(!a.length){v.appendChild(empty('No applications yet.','Each job the runners open appears here, with its best-known status.'));return}
      v.appendChild(table(['Day','Portal','Role','Company','Status','Detail','Link'],a.map(function(x){
        var tr=el('tr');tr.appendChild(td(dlabel(day(x.first||x.ts))+' '+hm(x.first||x.ts),'mono'));tr.appendChild(td(siteTag(x.site)));
        tr.appendChild(td(x.job||''));tr.appendChild(td(x.company||''));tr.appendChild(td(pill(x.status)));tr.appendChild(td(x.reason||(x.mode==='dry'?'dry run':'')));
        tr.appendChild(td(link(x.link,'posting')));return tr})));return;
    }
    if(tab==='qa'){
      var q=filtered(ev.filter(function(e){return e.type==='qa'}));
      if(!q.length){v.appendChild(empty('No answers yet.','Every question a portal asks, and the answer that was given, is logged here.'));return}
      v.appendChild(table(['When','Portal','Job','Question','Answer'],q.map(function(x){
        var tr=el('tr');tr.appendChild(td(dlabel(day(x.ts))+' '+hm(x.ts),'mono'));tr.appendChild(td(siteTag(x.site)));tr.appendChild(td(x.job||''));tr.appendChild(td(x.question||'','q'));tr.appendChild(td(x.answer||'','q'));return tr})));return;
    }
    if(tab==='mail'){
      var m=filtered(ev.filter(function(e){return e.type==='email'}));
      if(!m.length){v.appendChild(empty('No recruiter emails yet.','When a posting shows a contact address, it is captured here with the role it came from.'));return}
      v.appendChild(table(['Found','Portal','Email','Role','Company'],m.map(function(x){
        var tr=el('tr');tr.appendChild(td(dlabel(day(x.ts))+' '+hm(x.ts),'mono'));tr.appendChild(td(siteTag(x.site)));
        var c=el('span','mono',x.email||'');var b=el('button','copy','copy');b.type='button';b.onclick=function(){try{navigator.clipboard.writeText(x.email).then(function(){b.textContent='copied'},function(){b.textContent='select it'})}catch(e){b.textContent='select it'}};c.appendChild(b);
        tr.appendChild(td(c));tr.appendChild(td(x.job||''));tr.appendChild(td(x.company||''));return tr})));return;
    }
    if(tab==='prof'){
      var p=filtered(ev.filter(function(e){return e.type==='profile'}));
      if(!p.length){v.appendChild(empty('No profile updates yet.','Each refresh of the Naukri profile and resume upload is logged here.'));return}
      v.appendChild(table(['When','Result','Detail'],p.map(function(x){
        var tr=el('tr');tr.appendChild(td(dlabel(day(x.ts))+' '+hm(x.ts),'mono'));tr.appendChild(td(pill(x.ok?'ok':'error')));tr.appendChild(td(x.message||''));return tr})));return;
    }
  }

  function renderTabs(ev,apps){
    var n={feed:ev.length,fail:failedJobs(apps).length,apps:apps.length,qa:ev.filter(function(e){return e.type==='qa'}).length,mail:ev.filter(function(e){return e.type==='email'}).length,prof:ev.filter(function(e){return e.type==='profile'}).length};
    var nav=$('tabs');nav.textContent='';
    tabs.forEach(function(t){var b=el('button',null,t[1]);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===t[0]));b.appendChild(el('span','c',String(n[t[0]])));b.onclick=function(){tab=t[0];try{localStorage.setItem('jh-tab',tab)}catch(e){};render()};nav.appendChild(b)});
  }
  function renderDays(ev){
    var sel=$('fDay'),cur=sel.value,ds={};ev.forEach(function(e){ds[day(e.ts)]=1});
    var keys=Object.keys(ds).sort().reverse();
    if(sel.options.length-1===keys.length)return;
    sel.textContent='';var o=el('option',null,'All days');o.value='';sel.appendChild(o);
    keys.forEach(function(k){var x=el('option',null,dlabel(k));x.value=k;sel.appendChild(x)});sel.value=cur;
  }

  function render(){
    var ev=all(),apps=applications(ev);
    renderTiles(ev,apps);renderPortals(ev,apps);renderFailBox(apps);renderChart(apps);renderLatest(ev);renderDays(ev);renderTabs(ev,apps);renderView(ev,apps);
    $('note').textContent=(meta.note||'')+(meta.updated?'  Last pushed '+new Date(meta.updated).toLocaleString()+'.':'');
    var newest=ev[0];$('synced').textContent=newest?'latest event '+dlabel(day(newest.ts))+' '+hm(newest.ts):'no events yet';
    $('dot').className='dot'+(newest&&(Date.now()-new Date(newest.ts))<3600e3?' on':'');
  }

  try{var st=localStorage.getItem('jh-tab');if(st&&tabs.some(function(t){return t[0]===st}))tab=st}catch(e){}
  ['fSite','fDay','fQ'].forEach(function(id){$(id).addEventListener('input',render)});
  render();

  (async function(){
    var db=null;try{db=await window.claude.use('db')}catch(e){}
    if(!db){$('synced').textContent='sign in to load the live data';return}
    db.collection('feed').onSnapshot(function(snap){feedDocs={};snap.docs.forEach(function(d){feedDocs[d.id]=d.data()||{}});render()},function(){$('synced').textContent='could not read the feed'});
    db.doc('meta/portals').onSnapshot(function(s){meta=s.exists?(s.data()||{}):{};render()},function(){});
  })();
})();
</script>
